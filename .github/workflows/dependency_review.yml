name: Call Reusable Workflows

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  call-sbom-upload:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: appsecdemos/reusable-workflows/.github/workflows/sbom_upload.yml@v1

  call-dependency-review:
    if: github.event_name == 'pull_request'
    uses: appsecdemos/reusable-workflows/.github/workflows/pr_dependency_review.yml@v1
